<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Forgot Password | Back</title>
  </head>
  <body>
    <div id="success-msg" class="success-message">Reset link sent! Check your email.</div>
    <div class="container">
      <div class="content">
        <h1>Recover</h1>
        <p>Enter your email to receive a reset link.</p>
        <form onsubmit="event.preventDefault(); showSuccess();">
          <div class="input__group">
            <label>E-mail</label>
            <input type="email" placeholder="Enter your e-mail" required />
          </div>
          <button type="submit">Send Reset Link</button>
        </form>
        <p>Remembered your password? <a href="index.html">Back to login</a></p>
      </div>
    </div>
    <script>
      function showSuccess() {
        const msg = document.getElementById('success-msg');
        msg.classList.add('show');
        setTimeout(() => {
          msg.classList.remove('show');
          window.location.href = 'reset.html';
        }, 3000);
      }
    </script>
  </body>
</html>
